<text x="828" y="563" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Vuoto → «Crea una nuova materia».</text>
<text x="828" y="583" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Caricamento → «Attendi il controllo remoto».</text>
<text x="828" y="603" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Pronto → «Apri il primo PDF».</text>
<text x="828" y="623" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Avviso → «Riconcilia prima del reinvio».</text>
<text x="828" y="643" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Errore → «Apri diagnostica».</text>
<text x="828" y="663" font-family="DejaVu Sans, sans-serif" font-size="10.5" font-weight="23" text-anchor="start" fill="#142C43">Disabilitato → «Completa i controlli».</text>
